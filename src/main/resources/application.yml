spring:
  application:
    name: springboot-mp
  servlet:
    multipart:
      max-request-size: 30MB
      max-file-size: 30MB
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: jdbc:sqlite:db/baseInfo.db
  flyway:
    enabled: false
    locations: classpath:db/sqlite
    validate-on-migrate: true
    table: flyway_schema_history
    baseline-on-migrate: true
    out-of-order: false
server:
  port: 30000
  address: 127.0.0.1
logging:
  level:
    org.apache.hc.client5: Error

